<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECKBOX TEST</title>
</head>
<body>
    <form action="#" method="get" name="myForm">
                    <!-- 다 문자열인 것 잊지 말기. -->
        <input type="checkbox" name="food" id="food1" value="1500">
        <label for="food1">추가채소 1500원</label> <br>
        <input type="checkbox" name="food" id="food2" value="1000">
        <label for="food2">추가음료 1000원</label> <br>
        <input type="checkbox" name="food" id="food3" value="500">
        <label for="food3">추가피클 500원</label> <br>

        <button type="button">add</button>
        <!-- <button type="submit">add</button> -->
    </form>

    <hr>

    <p id="result">추가금액: 0원</p>

    <script>
        // 객체 찾기.
        const btn = document.querySelector('[type="button"]');
        const foodArray = document.myForm.food;
        const pobj = document.querySelector("p#result");

        // 이벤트 리스너등록(onclick).
        foodArray[0].addEventListener("click", check);
        foodArray[1].addEventListener("click", check);
        foodArray[2].addEventListener("click", check);
        // btn.addEventListener("click", check);

        // foodArray.forEach((obj) => 
        // {
        //     obj.addEventListener("click", check)
        // });

        foodArray.forEach(obj => obj.addEventListener("click", check));

        // btn.addEventListener("click", check);
        btn.addEventListener("click", btnCheck);

        // 이벤트 핸들러 함수(이름있는 선언함수).
        function check ()
        {
            let sum = 0;
            // alert(`${foodArray.length}`);

            foodArray.forEach((obj, i) =>
            {
                if (obj.checked === true)
                {   // checked돼있으면 true.
                    sum += parseInt(obj.value);   // 문자열로 오기때문에 parseInt작업 해주는 것 잊지 않기.
                }
            });
            pobj.textContent = `추가금액 : ${sum}원`;
        }

        function btnCheck ()
        {
            let sum = 0;
            foodArray.forEach((obj, i) =>
            {
                if (obj.checked === true)
                {   // checked돼있으면 true.
                    sum += parseInt(obj.value);   // 문자열로 오기때문에 parseInt작업 해주는 것 잊지 않기.
                }
            });
            pobj.textContent = `추가금액 : ${sum}원`;

            if (sum === 0)
            {
                alert("1개 이상 선택하세요.");
                return;
            } else
            {
                alert("서버로 데이터를 전송합니다.")
            }
        }
    </script>
</body>
</html>
