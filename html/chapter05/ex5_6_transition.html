<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANSITION TEST</title>
    <style>
        body h1:first-child
        {
            transition: 1s; /*커서를 올렸을 때 효과가 지연되는 시간.*/
        }

        body h1:first-child:hover
        {
            text-shadow: 7px 7px 8px #57c;
        }
        
        body h1:nth-child(2)
        {
            transition: 0.5s;
        }

        body h1:nth-child(2):hover
        {
            text-shadow: 7px 7px 8px pink;
        }
        /*body h1:nth-child(1)
        {

        }*/
    </style>
</head>
<body>
    <h1>마우스를 올려보세요</h1>
    <h1>transition 위치 변경</h1>
    
</body>
</html>
