<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIMATION TEST</title>

    <style>
        @keyframes down
        {
            0%
            {
                transform: translateY(0px) scale(1,1) rotateX(0deg);
                border-radius: 10%;
                border: 1px dotted black;
                /*transform: scale(1,1);*/
            }

            50%
            {
                transform: translateY(300px) scale(2,2) rotateX(180deg);
                /*transform: scale(2,2);*/
                border-radius: 50%;
                border: 1px dotted black;
            }

            100%
            {
                transform: translateY(0px) scale(1,1) rotateX(0deg);
                /*transform: scale(1,1);*/
                border-radius: 10%;
                border: 1px dotted black;
            }
        }

        body img:nth-child(1)
        {
            animation: down 3s;
        }

        body img:nth-child(2)
        {
            animation: down 4s infinite;
        }

        body img:nth-child(3)
        {
            animation: down 3s infinite alternate;
        }

        body img:nth-child(4)
        {
            /*animation: down 3s linear 5;*/
            animation: down 3s cubic-bezier(.17,.67,.83,.67) 5;
        }
    </style>
</head>
<body>
    <img src="media/font/font_h.png" alt="h">
    <img src="media/font/font_t.png" alt="t">
    <img src="media/font/font_m.png" alt="m">
    <img src="media/font/font_l.png" alt="l">
    
</body>
</html>
