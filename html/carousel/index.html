<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAROUSEL TEST</title>
    <link rel="stylesheet" href="./css/index.css">

    <!-- <link href="https://fonts.googleapis.com/css2?family=Playwrite+GB+S:ital,wght@0,100..400;1,100..400&display=swap" rel="stylesheet"> -->
                                                        <!-- async -->
    <script src="js/index.js"></script>
    <script src="https://kit.fontawesome.com/b551008ea2.js" defer crossorigin="anonymous"></script>
</head>
<body onload="carousel();">
    <div class="slideShow">
        <!-- slideShow안에 3명의 자식. -->
         <!-- onmouseenter="" 안씀. -->
        <div class="slideShow_slides">
            <a href="#"><img src="img/slide-1.jpg" alt="slide-1"></a>
            <a href="#"><img src="img/slide-2.jpg" alt="slide-2"></a>
            <a href="#"><img src="img/slide-3.jpg" alt="slide-3"></a>
            <a href="#"><img src="img/slide-4.jpg" alt="slide-4"></a>
        </div>

        <!-- 아이콘. -->
        <div class="slideShow_nav">
            <a href="#" class="pre"><i class="fa-solid fa-circle-chevron-left"></i></a>
            <a href="#" class="next"><i class="fa-solid fa-circle-chevron-right"></i></a>
        </div>

        <div class="slideShow_indicator">
            <a href="#" class="active"><i class="fa-solid fa-circle-dot"></i></a>
            <a href="#"><i class="fa-solid fa-circle-dot"></i></a>
            <a href="#"><i class="fa-solid fa-circle-dot"></i></a>
            <a href="#"><i class="fa-solid fa-circle-dot"></i></a>
        </div>
    </div>
</body>
</html>
