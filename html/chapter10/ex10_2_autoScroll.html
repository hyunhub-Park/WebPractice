<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO SCROLL TEST</title>

    <style>
        p, h2
        {
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>자동 스크롤</h2>
    <script>
        // 변수 선언.
        let position = 0;   // y축.



        for (let i = 1; i <= 30; i++)
        {
            document.write("<hr>");
            document.write(`<p>${i}</p>`);
        }

        // 계속 반복해야하므로 interval.(스크롤)
        setInterval(()=>
        {
            // y축이 50씩 계속 움직임.
            window.scrollBy(0, 50);
            position = position+50;

            // 스크롤 위치가 맨 하단에 도달했을 시, 위로 올라가야 함.
            if (position >= window.innerHeight + 50)
            // window.screen.height 사용해도 됨. ch10_50p.
            // window.screen.availHeight 사용해도 됨. ch10_50p.
            {
                position = 0;
                window.scrollTo(0, 0);
            }
        }, 400);
        
        // document.write("<hr>");
        // document.write("<p>2</p>");




    </script>
    
</body>
</html>
