<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SET INTERVAL TEST</title>

    <script>
        function onLoad ()
        {
            // 객체 찾기.
            const btn1 = document.querySelector('#stop');
            const btn2 = document.querySelector('#start');
            const h1obj = document.querySelector("h1");
            console.log('h1obj : ' ,h1obj)

            let intervalID = null;

            // 이벤트 등록.
            btn1.addEventListener ("click", () =>
            {
                clearInterval(intervalID);
            });
            
            btn2.addEventListener("click", () =>
            {
                intervalID= setInterval(letterRotate, 1000); 
            }); 

            // 회전기능을 하는 핸들러 함수.
            // 계속 회전.
            function letterRotate ()
            {
                    let data = h1obj.textContent;
                    let firstChar = data[0];
                    let text = data.slice(1) + firstChar;
                    h1obj.textContent = text;
            }
            intervalID = setInterval(letterRotate, 1000);
            // const intervalID = setInterval(letterRotate, 1000);
            // letterRotate();
        }
    </script>
</head>
<body onload="onLoad()">
    <h1>programming</h1>
    <button type="button" id="stop">정지</button>
    <button type="button" id="start">재생</button>
