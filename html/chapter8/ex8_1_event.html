<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENT TEST</title>
</head>
<body>
    <p id="elmID">p id = "elmID" class</p>
    <p>p & no class</p>
    <p class="elm">p class = "elm" 1</p>
    <p class="elm">p class = "elm" 2</p>

    <hr>

    <script>
        // 두 개의 객체를 찾아 값을 출력.(eml1, elm2)
        // p로 찾으면 3개가 찾아지니 class로 찾으면 알맞음.
        const elmArray = window.document.querySelectorAll(".elm");   // class니까 .으로! 여러개니까 seletorAll로!
                                                                     // 이미 찾아진 객체 배열은 const로!

        // 원래는 p.elements이런식으로 해야하는데,
        // 클래스명으로 객체를 찾음.
        elmArray.forEach((elm, index) =>
        document.write(`querySelectorAll : elm[${index}] = ${elm.textContent} <br>`));
        // 원래는 p.elements이런식으로 해야하는데,
        
        // elmArray.forEach((elm, index) =>
        // {   // 객체, 인덱스 가져옴. 필요한 것만 가져와도 됨.
        //     document.write(`querySelectorAll : elm[${index}] = ${elm.textContent}`);
        // });

        // 태그명으로 객체를 찾음.
        // const elmArray = window.document.querySelectorAll("p"); // 속성으로 찾으려면 "[class="elm"]"
        const pArray = window.document.querySelectorAll("p");
        pArray.forEach ((pobj, i) =>
        {
            document.write(`queryAll : TagName p[${i}] = ${pobj.textContent} <br>`);
        });

        // id명으로 객체를 찾음. 객체 하나이므로 for문을 사용하면 오류가 남.
        const elmID = document.querySelector("#elmID");
        document.write(`querySelector : id p = ${elmID.textContent} <br>`);

        // body의 자식으로 객체를 찾음.
        const bodyChildArray = window.document.querySelectorAll("body > p");
        bodyChildArray.forEach ((bodyChild, i) =>
        {   // 자식 4명임.
            document.write(`queryAll : body child p[${i}] = ${bodyChild.textContent} <br>`);
        });

        // 속성으로 객체를 찾음.
        const classElmArray = window.document.querySelectorAll('[class="elm"]');
        classElmArray.forEach ((attrObj, i) =>
        {   // 자식 4명임. 그 중에 elm이라는 class만.
            document.write(`queryAll : [class="elm"] p[${i}] = ${attrObj.textContent} <br>`);
        });
    </script>
</body>
</html>
