<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAGE CHANGE TEST</title>
    <style>
        aside
        {
            display: flex;
            flex-direction: column;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
            text-align: center; /*아니면 inline-block먹여서!*/
        }

        .banner
        {
            width: 150px;
            height: 150px;
            box-shadow: 10px 5px 5px rgba(255, 222, 222, 0.5);
        }
        
    </style>
    
    <script>
        function onLoad ()
        {
            // 객체 찾기.
            const img = document.querySelector('img');
            const btn = document.querySelector('button');

            // // 이벤트리스너 등록.
            // btn.addEventListener("click", () =>
            // {
            //     // alert(`${img.src}`);
            //     let num = Math.floor(Math.random()*(3-1+1)+1);
            //     let srcData = `media/food${num}.png`;
            //     img.src = srcData;
            // });
            // 이벤트리스너 등록.
            btn.addEventListener("click", imgChange);

            function imgChange ()
            {
                let num = Math.floor(Math.random()*(3-1+1)+1);
                let srcData = `media/food${num}.png`;
                img.src = srcData;
            }

            setInterval(imgChange, 3000);
        }

    </script>
</head>
<body onload="onLoad();">
    <aside>
        <div class="banner">
            <a href="#">
                <img src="media/food1.png" alt="food1"> <br>
            </a>
            <button type="button">change</button>
        </div>
    </aside>
</body>
</html>
