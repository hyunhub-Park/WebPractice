<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELECT OPTION TSET</title>
</head>
<body>
    <form action="#" method="get" name="myForm">
        <label for="animal">키우고 싶은 동물은</label> <br>
        <select name="animal" id="animal">
            <option value="0">선택해주세요.</option>
            <option value="1">고양이</option>
            <option value="2">개</option>
            <option value="3">햄스터</option>
            <option value="4">물고기</option>
            <option value="5">금붕어</option>
        </select> <br> <br> <!--인라인이라 margin은 안되므로 inline-block으로 바꿔서 하면 됨!-->
        <!-- 이벤트. -->
        <button type="button">이벤트처리</button>
    </form>

    <hr>

    <p id="result">선택된 동물 : 없음</p>

    <script>
        // 객체찾기.
        const name = ["선택 안함.", "고양이", "개", "햄스터", "물고기", "금붕어"];
        const btn = document.querySelector('[type="button"]');
        const pobj = document.querySelector('p#result');
        const animal = document.myForm.animal;

        // 이벤트 리스터 등록. #1
        btn.addEventListener("click", () =>
        {
            // alert(`${animal.selectedIndex}`);
            let index = animal.selectedIndex; 
            let result = animal.options[index].value;
            pobj.textContent = `선택된 동물 : ${name[result]}`;
            // pobj.textContent = `선택된 동물 : ${result}`;
            // pobj.textContent = `선택된 동물 : ${animal.options[animal.selectedIndex].value}`;
        });

        // 이벤트 리스너 등록. #2
        // onchange -> 값이 변하면 ~
        animal.addEventListener("change", () => {
            let index = animal.selectedIndex; 
            let result = animal.options[index].value;
            pobj.textContent = `선택된 동물 : ${name[result]}`;
        });
    </script>
    
</body>
</html>
