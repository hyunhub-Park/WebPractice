<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM DATA</title>
    <style>
        form
        {
            width: 400px;
            border: 1px solid black;
            margin: 0 auto;
            /*overflow: hidden; width가 적을 경우, 메모가 넘치면 해당 문구 사용.*/
            padding: 10px;
        }

        label
        {
            display: inline-block;
            width: 150px; /*inline이라서 속성 적용이 안됨. display: inline-block;으로 해야 함.*/
        }

    </style>
</head>
<body>
    <h1 style="display: none;">form data</h1>
    <form action="#" method="post">
        <fieldset>
            <legend>개인정보 입력란</legend>
            <label for="age">나이</label>
            <input type="text" name="age" id="age"> <br>
            
            <label for="email">이메일</label>
            <input type="text" name="email" id="email" placeholder="HTML"> <br>
        </fieldset>

        <fieldset>
            <legend>가입</legend>
            <label for="id">아이디</label>
            <input type="text" name="id" id="id" placeholder="아이디"> <br>
            
            <label for="pwd">패스워드</label>
            <input type="password" name="pwd" id="pwd" placeholder="비밀번호"> <br>
        </fieldset>
        
        
        <label for="pwd">자기소개서</textarea></label> <br>
        <textarea name="intro" id="intro" cols="30" rows="10">
            문자
        </textarea> <br>
        
        <fieldset>
            <legend>서버전송 및 취소</legend>
            <button type="submit">서버전송</button> <!--새 창에서 열릴 수 있도록 변경해보기. anchor?-->
            <button type="reset">전송취소</button>
        </fieldset>


    </form>
</body>
</html>
