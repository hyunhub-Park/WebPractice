<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUBMIT & RESET TEST</title>
    <script>
        function onLoad ()
        {
            // 객체 찾기.
            // queryselector로 찾아도 됨.
            const myform = document.myform;
            const id = document.myform.id;
            const pwd = document.myform.pwd;
            const checkID = "psh";
            const checkPWD = "1234";

            // 이벤트 리스너 등록 및 핸들러 처리.
            // 전송 전 데이터를 점검 !!!!!!!
            myform.addEventListener("submit", (event) =>
            {
                // alert(`submit`);
                
                // 
                event.preventDefault();
                
                // 패턴 검색.

                // 값 체크.
                if (id.value !== checkID)
                {
                    id.nextSibling.textContent = "아이디가 일치하지 않습니다.";
                    id.value = "";  // 틀리면 입력된 문구 다 지움.
                    id.focus(); // 틀려도 경고문 옆에 뜬 다음에 포커스는 아이디란에 계속.
                    return;
                } else
                {
                    id.nextSibling.textContent = "일치";
                }

                if (pwd.value !== checkPWD)
                {
                    pwd.nextSibling.textContent = "패스워드가 일치하지 않습니다.";
                    pwd.value = "";  // 틀리면 입력된 문구 다 지움.
                    pwd.focus(); // 틀려도 경고문 옆에 뜬 다음에 포커스는 아이디란에 계속.
                    return;
                } else
                {
                    pwd.nextSibling.textContent = "일치";
                }
                myform.submit();    // 서버에 데이터를 전송하고, 폼에 있는 데이터는 reset한다.
            });
        }
    </script>
</head>
<body onload="onLoad();">
    <form action="#" method="get" name="myform">
        <!-- submit과 reset. 모두 보내거나 모두 지우는 것. -->
        <label for="id">ID 입력 : </label>
        <input type="text" name="id" id="id" placeholder="테스트"><span></span><br>
        <!-- get방식은 pwd도 도메인 옆쪽에 보이기 때문에 단점. -->
        <label for=pwd">PWD 입력 : </label>
        <input type="password" name="pwd" id=pwd" placeholder="암호입력"><span></span><br>
        <button type="submit">전송하기</button>
        <button type="reset">취소하기</button>
    </form>
    <hr>
    <p></p>
</body>
</html>
