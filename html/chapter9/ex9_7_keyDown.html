<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEY DOWN TEST</title>
    <script>

        function onLoad ()
        {
            // 변수 선언.
            let wb = 0;

            // 객체 찾기.
            const img = document.querySelector("img");

            // 이벤트 등록 및 핸들러 처리.
            window.document.addEventListener("keydown", (e)=>
            {
                // console.log(e);
                if (e.key === "ArrowLeft")
                {
                    wb = wb - 10;
                    if (wb < 0)
                    {
                        wb = 0;
                    }
                } else if (e.key === "ArrowRight")
                {
                    wb = wb + 10;
                    if (wb > 300)
                    {
                        wb = 300;
                    }
                } else
                {
                    alert("좌, 우 방향키만 입력 가능합니다.");
                    return;
                }

                img.style.transform = `translateX(${wb}px)`;
            });
        }
    </script>
</head>
<body onload="onLoad();">
    <h3>좌, 우 키보드를 눌러 이미지를 움직여보세요!</h3>
    <img src="ch09_media/photo1.jpg" alt="photo1">
</body>
</html>
