<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUBBLING TEST</title>
    <!-- 전파중지. -->
    <style>
        div.parent
        {
            width: 400px;
            height: 400px;
            border: 1px solid black;
            background-color: beige;
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        div.parent > span
        {
            position: absolute;
            left: 10px;
            top: 10px;
        }

        div.child
        {
            width: 300px;
            height: 300px;
            border: 1px solid black;
            background-color: blue;
        }
    </style>

    <script>
        function onLoad ()
        {
            // 객체 찾기.
            const divParent = document.querySelector(".parent");
            const divChild = document.querySelector(".child");

            // 이벤트 등록 및 핸들러 처리. (버블링 방식)
            // divParent.addEventListener("click", () =>
            // {
            //     alert(`divParent`);
            // });

            // divChild.addEventListener("click", () =>
            // {
            //     // child를 클릭하면 child알람이 뜨지만, 부모도 이미 클릭을 받은 것이므로, 후에 부모의 알림도 뜸.
            //     alert(`childParent`);
            // });

            // PROPAGATION() - 이벤트 등록 및 핸들러 처리. (버블링 방식)
            divParent.addEventListener("click", () =>
            {
                alert(`divParent`);
            });

            divChild.addEventListener("click", (event) =>
            {
                // child와 parent의 클릭 이벤트가 각각 영역마다 따로 발생함.
                alert(`childParent`);
                event.stopPropagation();
            });

            // // 이벤트 등록 및 핸들러 처리. (캡쳐링 방식)
            // divParent.addEventListener("click", () =>
            // {
            //     alert(`divParent`);
            // }, true);

            // divChild.addEventListener("click", () =>
            // {
            //     // child를 클릭하면 child알람이 뜨지만, 부모도 이미 클릭을 받은 것이므로, 후에 부모의 알림도 뜸.
            //     alert(`childParent`);
            // }, true);
        }
    </script>
</head>
<body onload="onLoad();">
    <div class="parent">
        <span>부모 영역</span>
        <div class="child">
            <span>자식 영역</span>
        </div>
    </div>
    
</body>
</html>
