<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRPLANE TEST</title>
    <script>
        function onLoad ()
        {
            // 객체 찾기.
            const img = document.querySelector("img");

            // 이벤트 리스너 등록 및 핸들러 처리.
            window.document.addEventListener("mousemove", (e) => 
            {
                // 마우스 이벤트 정보를 통해 위치값을 가져옴.
                const x = e.clientX;
                const y = e.clientY;

                // 컴마 주의.
                img.style.transform = `translate(${x}px, ${y}px)`;
            });
        }
    </script>
</head>
<body onload="onLoad();">
    <img src="ch09_media/photo3.png" alt="airplane">
</body>
</html>
