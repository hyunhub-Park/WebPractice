<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLICK EVENT TEST</title>
    <style>
        img
        {
            border: 1px solid black;
            /* transform: rotate(120deg); */
        }
    </style>

    <script>
        function onLoad ()
        {
            // 클릭 마다 각도가 바뀔 수 있는 변수.
            let deg = 0;


            // 객체 찾기.
            const imgObj = document.querySelector('[src="media/food1.png"]');

            // 이벤트 리스너 등록 및 핸들러 기능.
            imgObj.addEventListener("click", () =>
            {
                deg += 90;
                // alert(`테스트`);
                imgObj.style.transform = `rotate(${deg}deg)`;
            });
        }
    </script>
</head>
<body onload="onLoad();">
    <p>이미지를 클릭해보세요</p>
    <img src="media/food1.png" alt="food1">
    
</body>
</html>
