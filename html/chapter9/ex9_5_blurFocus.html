<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLUR & FOCUS TEST</title>
    <style>
        input
        {
            padding: 10px;
            font-size: 16px;
            /* input의 테두리 색. */
            
            outline: none;  /*클릭 했다는 것을 알아차릴 수 있는.*/
                            /* focus를 주었을 때, 윤곽선 발생하는 것 방지. */
            /* border: none; */
            border: 1px solid rebeccapurple;
        }
    </style>

    <script>
        function onLoad ()
        {
            // 객체 찾기.
            const input = document.querySelector("input");

            // 이벤트 리스너 등록 및 핸들러 처리.
            input.addEventListener("focus", () =>
            {
                // focus를 주면 input에 있는 스타일을 바꿔라.
                input.style.border = "2px dotted red";
                // 스타일이 아닌 속성이니까.
                input.placeholder = "입력하세요."

                // 커서를 바깥으로 클릭하면 나가야하니까. -> 블러.
                input.addEventListener ("blur", ()=>
                {
                    input.style.border = "1px solid black";
                    input.placeholder = "클릭하세요!"
                });
            });
        }
    </script>
</head>
<body onload="onLoad();">
    <form action="#" method="post">
        <input type="text" placeholder="클릭하세요!">
    </form>
</body>
</html>
