<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENT TEST</title>
    <script>
        let count = 0;
        function colorChange()
        {
            let h1Obj = window.document.getElementById("change");  // change라는 'id'로 h1객체를 찾는 것.
            count++;

            if (count%2 === 0)
            {
                h1Obj.style.backgroundColor = "red";
                h1Obj.style.color = "white";

            } else
            {
                h1Obj.style.backgroundColor = "blue";
                h1Obj.style.color = "black";

            }

            // window.alert("change");
            // html UI객체를 가져온다.
            // h1Obj.style.backgroundColor = "red";
            // h1Obj.style.color = "white";


        }
    </script>

    
</head>
<body>
    <!--함수를 내가 이름지어서 만든건가..? 아님 있는건가?-->
    <h1 id="change" onclick="colorChange();"> Change Colors</h1>
    
</body>
</html>
