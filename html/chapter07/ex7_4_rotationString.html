<body>
    
    <script>
        // const text = "Programming"; // 전역변수
        let text = "Programming";
        
        for (let i = 0; i <= text.length; i++)
        {
        window.document.write(`${text} <hr>`);
        const firstChar = text.charAt(0);
                                // 끝위치.
        text = text.substring(1, text.length) + firstChar;
    }
        
    </script>
