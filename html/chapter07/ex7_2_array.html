<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARRAY TEST</title>
    <script>
        let a1 = new Array(0, 1, 2, 3, 4);
        let a2 = [9, 8, 7, 6, 5];

        document.writeln(`a1 = [${a1}] <br>`);
        document.write(`a1 = [${a2}]`);

        let a3 = a1.concat(a2);

        document.writeln(`<br> a1.concat(a2) : [${a3}]`);

        // 필터링을 진행하는 이름 있는 함수.
        // 함수도 될 수 있고, 추상메소드도 될 수 있음.
        function filterValue (item)
        {
            return item > 7;
        }

        // predicate와 같은 것.
        // item : 9, 8, 7, 6, 5
        // let a4 = a2.filter(function(item, index, a2Array)
        // {
        //     console.log(item, index, a2Array);
        //     return item > 7;
        // });
        
        // // predicate와 같은 것.
        // // item : 9, 8, 7, 6, 5
        // let a4 = a2.filter(function(item)
        // {
        //     console.log(item, index, a2Array);
        //     return item > 7;
        // });

        // 화살표 함수.(람다식)
        // let a4 = a2.filter(item => item >= 7);
        
        // 이름 있는 함수.
        // let a4 = a2.filter(filterValue);

 
        // 익명 함수.
        let a4 = a2.filter(function (item)
        {
            return item > 7;
        });
        document.write(`<br>a2.filter : [${a4}]`);

        // indexOf는 배열속에서 값을 찾아 위치값을 요구함.
        let index = a2.indexOf(6);
        document.write(`<br>a2.indexOf(6) : [${index}]`);

        // 배열에 값을 삽입.
        a2.push(11);
        document.write(`<br>a2.push(5) -> [${a2}]`);

        // 배열 뒤에서 값을 뺌.
        let popValue = a2.pop();
        document.write(`<br>a2.pop() -> [${a2}]`);
        document.write(`<br>popValue : ${popValue}`);

        // 배열 reverse.
        // 자기 자신의 배열 구조가 변화됨. a에 이미 a1.reverse값을 준 것.
        let a5 = a1.reverse();
        document.write(`<br>a1 = [${a5}]`);
        document.write(`<br>a1.reverse() = [${a5}]`);

        // 배열 앞에서 값을 빼버린 것. shift();
        let shiftValue = a2.shift();
        document.write(`<br>a2.shift() = [${a2}]`)
        document.write(`<br>a2의 shiftValue = [${shiftValue}]`)

        // 배열 앞에서 값을 입력한 것. unshift()
        a2.unshift(20);
        document.write(`<br>a2.shift(20) = [${a2}]`);

        // 슬라이스.
        // a2 = [9,8,7,6,5];
        // 2번째 인덱스에서 4번째 인덱스까지 모두!
        let a6 = a2.slice(2, 4);
        document.write(`<br>a2.slice(2, 4) = [${a6}]`);

        // 정렬.
        // 20, 5, 6, 7, 8 앞 숫자로만 정렬이 됨. 따라서 따로 조치를 취해야 함.
        // java의 compareTo와 같은.
        let a7 = a2.sort((item1, item2) =>
        {
            // return item2 - item1;    // 역정렬.
            return item1 - item2;
        });
        document.write(`<br>a2.sort() = [${a7}]`);

        // Join. 배열을 문자열로 변환. 내가 원하는 형태로 변환해줌.
        let dataValue = a2.join("=");
        document.write(`<br>a2.join = [;${dataValue}]`)

        

    </script>
</head>
<body>
</body>
</html>
